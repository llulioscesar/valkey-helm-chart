apiVersion: v2
name: valkey
description: Valkey is an open source, high-performance data structure server compatible with Redis. It supports strings, hashes, lists, sets, and sorted sets.
type: application
version: 0.2.9
appVersion: "9.1.2"
annotations:
  artifacthub.io/signKey: |
    fingerprint: 35D9AD8B98D2FB5AF685CABA019335D0A0561140
    url: https://start-codex.github.io/valkey-helm-chart/public-key.asc
  artifacthub.io/category: database
  artifacthub.io/license: Apache-2.0
  artifacthub.io/links: |
    - name: Valkey Official
      url: https://valkey.io/
    - name: Chart Source
      url: https://github.com/start-codex/valkey-helm-chart
  artifacthub.io/images: |
    - name: valkey
      image: cgr.dev/chainguard/valkey:latest
    - name: wolfi-base
      image: cgr.dev/chainguard/wolfi-base:latest
    - name: redis-exporter
      image: docker.io/oliver006/redis_exporter:v1.91.1
    - name: kubectl
      image: cgr.dev/chainguard/kubectl:latest
  artifacthub.io/containsSecurityUpdates: "true"
  artifacthub.io/prerelease: "false"
  artifacthub.io/changes: |
    - kind: fixed
      description: Sentinel mode now replicates with auth (requirepass and masterauth on master and replicas)
    - kind: fixed
      description: sentinel.conf rendered for architecture sentinel instead of sentinel.enabled
    - kind: fixed
      description: Sentinel and data pods discover the current master instead of the master Service IP, so clients follow failovers
    - kind: fixed
      description: Restarted sentinels reuse their config instead of looping on Duplicate master name
    - kind: fixed
      description: replica.affinity no longer breaks rendering
    - kind: fixed
      description: Standalone with auth no longer starts with a config missing everything but requirepass (cp is absent from the Chainguard image)
    - kind: added
      description: startupProbe for master, replica and sentinel in sentinel mode
    - kind: changed
      description: Sentinel defaults parallelSyncs 10 and failoverTimeout 30000 so stale replica entries cannot stall a failover
keywords:
  - valkey
  - redis
  - database
  - cache
  - nosql
  - keyvalue
  - sentinel
  - high-performance
home: https://valkey.io/
icon: https://valkey.io/img/valkey-logo-og.png
sources:
  - https://github.com/valkey-io/valkey
  - https://github.com/start-codex/valkey-helm-chart
maintainers:
  - name: Valkey Community
    url: https://github.com/start-codex/valkey-helm-chart
    email: contact@valkey.io
