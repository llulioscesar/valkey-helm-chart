{{- if not .Values.existingConfigmap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "valkey.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- /* Stable labels only. The StatefulSets hash this whole rendered file
           into checksum/configmap; with the chart version in here, that hash
           changed on every release and restarted every pod even when the
           configuration was identical. */}}
    {{- include "valkey.selectorLabels" . | nindent 4 }}
  {{- with (include "valkey.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  {{- if eq .Values.architecture "standalone" }}
  valkey.conf: |
    {{- include "valkey.configuration" . | nindent 4 }}
  {{- else }}
  master.conf: |
    {{- .Values.master.configuration | nindent 4 }}
  replica.conf: |
    {{- .Values.replica.configuration | nindent 4 }}
  {{- if eq .Values.architecture "sentinel" }}
  sentinel.conf: |
    {{- .Values.sentinel.configuration | nindent 4 }}
  {{- end }}
  {{- end }}
{{- end }}